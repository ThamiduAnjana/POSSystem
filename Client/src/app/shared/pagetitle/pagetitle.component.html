<!-- breadcrumb item -->
<div class="row">
  <div class="col-12">
    <div class="page-title-box d-sm-flex align-items-center justify-content-between">
      <h4 class="mb-sm-0 font-size-18">{{ title }}</h4>
      <div class="page-title-right">
        <ol class="breadcrumb m-0 d-flex align-items-center">
          <ng-container *ngFor="let item of breadcrumbItems; let last = last">
            <li class="breadcrumb-item" [ngClass]="{'active': item.active == true}">{{ item.label }}</li>
          </ng-container>
          <li class="ms-2">
            <button type="button" class="btn btn-outline-secondary btn-sm waves-effect waves-light" (click)="goBack()">
              <i class="fa fa-angle-double-left"></i> Back
            </button>
          </li>
        </ol>
      </div>
    </div>
  </div>
</div>
